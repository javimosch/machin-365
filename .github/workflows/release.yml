name: release

# Cut a release by pushing a version tag:
#   git tag v0.2.0 && git push origin v0.2.0
# Builds the suite CLI natively for linux/amd64 and linux/arm64 (static
# OpenSSL cannot cross-compile) and attaches the binaries plus
# SHA256SUMS.txt. Asset names match install.sh: machin-365-linux-<arch>
# (no version in the filename — install.sh resolves latest/download/).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create releases and upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install static link deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev zlib1g-dev libzstd-dev

      - name: Install machin v0.142.0
        run: |
          curl -fsSL -o /tmp/machin \
            "https://github.com/javimosch/machin/releases/download/v0.142.0/machin-v0.142.0-linux-${{ matrix.arch }}"
          chmod +x /tmp/machin
          sudo mv /tmp/machin /usr/local/bin/machin

      - name: Build suite binary
        run: |
          mkdir -p dist
          ./build.sh
          mv build/machin-365 "dist/machin-365-linux-${{ matrix.arch }}"
          file "dist/machin-365-linux-${{ matrix.arch }}"

      - name: Smoke test on this arch
        run: MACHIN_365_HOME=/tmp/m365-rel ./dist/machin-365-linux-${{ matrix.arch }} catalog >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: machin-365-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # RELEASE GUARD, same shape as machin-bkn's release.yml: a tag push is
      # not a protected operation, so prove the tagged commit is on master
      # and that CI went green on it before anything is published.
      - name: Verify the tag is on master and CI passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          echo "tagged commit: $SHA"

          git fetch --quiet origin master

          if ! git merge-base --is-ancestor "$SHA" origin/master; then
            echo "::error::$SHA is not contained in origin/master — refusing to release a commit that is not on the default branch."
            exit 1
          fi
          echo "  on master: yes"

          CONCLUSION=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&status=completed" \
            --jq '[.workflow_runs[] | select(.name == "ci")] | first | .conclusion // "none"')
          echo "  ci conclusion: $CONCLUSION"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI for $SHA is '${CONCLUSION}', not 'success' — refusing to release an unverified commit. Wait for CI, or fix it, then re-tag."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ( cd dist && sha256sum machin-365-* > SHA256SUMS.txt && ls -l )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "machin-365 $TAG" \
              --generate-notes
          fi
