name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install static link deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev zlib1g-dev libzstd-dev

      - name: Install machin v0.142.0
        run: |
          curl -fsSL -o /tmp/machin \
            https://github.com/javimosch/machin/releases/download/v0.142.0/machin-v0.142.0-linux-amd64
          chmod +x /tmp/machin
          sudo mv /tmp/machin /usr/local/bin/machin

      - name: Build suite binary
        run: ./build.sh

      - name: Scope-strip regression test
        run: machin test $(ls src/*.src | grep -v 'src/main.src') test/scope_test.src

      - name: Smoke test
        run: |
          ./build/machin-365 catalog >/dev/null && echo "catalog ok"
          export MACHIN_365_HOME=/tmp/m365-ci
          ./build/machin-365 auth status | grep -q "not configured" \
            || { echo "auth status: unexpected output"; ./build/machin-365 auth status; exit 1; }
          # unconfigured sync must fail loudly, not silently succeed
          ./build/machin-365 sync 2>&1 | grep -q "no remote configured" \
            || { echo "sync: expected 'no remote configured'"; exit 1; }
